# Closed-loop oracle-image-conditioned RoboTwin evaluation.
# Run evaluate.py with --checkpoint, or connect it to a server started by serve.sh.
workspace: /path/to/vigar/assets
robotwin_root: /path/to/vigar/assets
server_url: http://127.0.0.1:18765
# The 50-task RoboTwin evaluation population.
tasks:
  - adjust_bottle
  - beat_block_hammer
  - blocks_ranking_rgb
  - blocks_ranking_size
  - click_alarmclock
  - click_bell
  - dump_bin_bigbin
  - grab_roller
  - handover_block
  - handover_mic
  - hanging_mug
  - lift_pot
  - move_can_pot
  - move_pillbottle_pad
  - move_playingcard_away
  - move_stapler_pad
  - open_laptop
  - open_microwave
  - pick_diverse_bottles
  - pick_dual_bottles
  - place_a2b_left
  - place_a2b_right
  - place_bread_basket
  - place_bread_skillet
  - place_burger_fries
  - place_can_basket
  - place_cans_plasticbox
  - place_container_plate
  - place_dual_shoes
  - place_empty_cup
  - place_fan
  - place_mouse_pad
  - place_object_basket
  - place_object_scale
  - place_object_stand
  - place_phone_stand
  - place_shoe
  - press_stapler
  - put_bottles_dustbin
  - put_object_cabinet
  - rotate_qrcode
  - scan_object
  - shake_bottle
  - shake_bottle_horizontally
  - stack_blocks_three
  - stack_blocks_two
  - stack_bowls_three
  - stack_bowls_two
  - stamp_seal
  - turn_switch
task_config: demo_randomized  # Official randomized environment profile
episodes: 1  # Per task: 1 = 50 total episodes; 10 = 500 total episodes
start_seed: 100000
max_seed_attempts: 100
instruction_type: unseen  # Official offline task-description templates
# Keep head-camera EEF state conditioning through the 0824 adapter. qpos executes
# predicted joint deltas reconstructed against the measured joints, plus grippers.
action_type: qpos  # Official joint control; requires supervised joint outputs
replan_steps: 32  # Predict 48, execute 32, then condition on a new measured anchor
max_policy_steps: null  # null: official per-task limit; an integer caps a smoke run
generation_seed: 9000
request_timeout: 600
save_video: true
# Optional prepared generated-goal experiment. Omission retains expert goals.
# Each case must match the reference benchmark's task, seed and instruction;
# the simulator loads generated_goal.png and never falls back to expert RGB.
# generated_goal_root: /path/to/prepared/generated_goals
# Maximum wait in seconds for each episode's goal when generation runs ahead.
# generated_goal_timeout: 7200
output: /path/to/vigar/assets
